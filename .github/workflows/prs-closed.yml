name: PR - Closed

on:
  pull_request:
    branches:
      - main
    types: [closed]

permissions:
  id-token: write
  deployments: write
  contents: read

jobs:
  delete-s3:
    name: Delete S3 preview
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name == 'vapor/docs' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          aws-region: ${{ vars.OIDC_ROLE_REGION }}
      - name: Delete preview bucket
        uses: brokenhandsio/s3-website-pr-action@904a6412af330dc591004ca782ec9122c4380f6f # v3.1.1
        with:
          bucket-prefix: "vapor-docs-pulls"
          bucket-region: "us-east-1"
